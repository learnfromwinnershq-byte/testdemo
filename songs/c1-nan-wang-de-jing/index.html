function chooseVoice(){

function speak(item,card){
  if(state.speaking?.card===card){stopAll();return;}

}
function stopAll(){
  if(state.speaking){const session=state.speaking;session.cancelled=true;speechSynthesis.cancel();session.cleanup?.();state.speaking=null;}
  if(state.recognition){try{state.recognition.stop();}catch{}state.recognition=null;}
  document.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.playing').forEach(b=>{b.classList.remove('playing');b.textContent='▶ 粵語示範';});
  document.querySelectorAll('.recording').forEach(b=>{b.classList.remove('recording');b.textContent='● 開始朗讀測評';});
}
function similarity(a,b){a=[...clean(a)];b=[...clean(b)];if(!a.length&&!b.length)return 100;let prev=b.map((_,j)=>j+1);for(let i=0;i<a.length;i++){const cur=[i+1];for(let j=0;j<b.length;j++)cur[j+1]=a[i]===b[j]?prev[j]:1+Math.min(prev[j],prev[j+1],cur[j]);prev=cur;}return Math.max(0,Math.round((1-prev[b.length]/Math.max(a.length,b.length,1))*100));}
function markApprox(card,target,heard){const hs=[...clean(heard)],spans=[...card.querySelectorAll('.word-span')];spans.forEach((s,i)=>s.classList.add(hs[i]===target[i]?'asr-ok':'asr-miss'));}
function assess(item,card){
  stopAll();clearMarks(card);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition,btn=card.querySelector('.record'),out=card.querySelector('.result');
  if(!SR){out.textContent='此瀏覽器不支援 Web Speech 語音識別；請改用最新版 Chrome / Edge。';return;}
  const r=new SR();state.recognition=r;r.lang='zh-HK';r.continuous=true;r.interimResults=true;let finalText='',interim='';
  r.onstart=()=>{btn.classList.add('recording');btn.textContent='■ 完成並評分';out.textContent='正在聆聽……請朗讀本頁四句，完成後再按一次。';btn.onclick=()=>r.stop();};
  r.onresult=e=>{interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;e.results[i].isFinal?finalText+=t:interim+=t;}out.textContent=`已識別：${finalText||interim}`;};
  r.onerror=e=>{out.textContent=e.error==='not-allowed'?'未取得麥克風權限，請在瀏覽器設定中允許。':`識別失敗：${e.error}`;};
  r.onend=()=>{state.recognition=null;btn.classList.remove('recording');btn.textContent='● 再次朗讀測評';btn.onclick=()=>assess(item,card);const heard=finalText||interim;if(!clean(heard).length){out.textContent='未識別到有效朗讀，請靠近麥克風再試。';return;}const target=item.lines.join('');const score=similarity(target,heard);markApprox(card,[...clean(target)],heard);if(score>(state.best[item.id]||0)){state.best[item.id]=score;localStorage.setItem('nanwangBestScores',JSON.stringify(state.best));card.querySelector('.best b').textContent=score;updateScore();}out.innerHTML=`本次得分：<strong>${score}</strong> / 100　<span>識別：${esc(heard)}</span>`;};
  r.start();
}
function updateScore(){$('#totalScore').textContent=pageData.reduce((n,x)=>n+(state.best[x.id]||0),0);}
function restartSpeakingWithNewRate(){
  const session=state.speaking;if(!session?.item)return;
  const item=session.item,card=session.card;
  state.selected[item.id]=session.index;
  stopAll();
  setTimeout(()=>speak(item,card),80);
}
$('#rate').oninput=e=>{state.rate=+e.target.value;$('#rateValue').textContent=state.rate.toFixed(2)+'×';clearTimeout(state.rateTimer);if(state.speaking)state.rateTimer=setTimeout(restartSpeakingWithNewRate,180);};
$('#repeatCount').value=String(state.repeat);
$('#repeatCount').onchange=e=>{state.repeat=Number(e.target.value);localStorage.setItem('nanwangRepeatCount',String(state.repeat));};
$('#toggleJyutping').onclick=e=>{state.showJyutping=!state.showJyutping;e.currentTarget.setAttribute('aria-pressed',state.showJyutping);e.currentTarget.textContent=`粵拼：${state.showJyutping?'顯示':'隱藏'}`;applyVisibility();};
$('#prev').onclick=()=>{if(state.page>0){state.page--;render();scrollTo({top:0,behavior:'smooth'});}};
$('#next').onclick=()=>{if(state.page<pageData.length-1){state.page++;render();scrollTo({top:0,behavior:'smooth'});}};
speechSynthesis?.addEventListener?.('voiceschanged',()=>{});render();
</script>
