  <style>
    :root{--ink:#d8e8e9;--muted:#93aaad;--night:#041015;--panel:#091b22;--cyan:#63e2df;--amber:#ffd06a;--line:rgba(147,210,211,.2)}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;color:var(--ink);background:radial-gradient(circle at 76% 15%,rgba(35,110,126,.26),transparent 32rem),linear-gradient(145deg,#07161d,#02090d 68%);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif}
    a{color:inherit}
    .shell{width:min(1160px,calc(100% - 40px));margin:auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:82px}
    .back{color:#a9c1c3;text-decoration:none;font-weight:800}.back:hover,.back:focus-visible{color:#fff;outline:none;text-decoration:underline}
    .code{padding:7px 10px;border:1px solid var(--line);color:var(--cyan);font:700 .78rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}
    main{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(330px,.88fr);gap:clamp(28px,5vw,70px);align-items:center;min-height:calc(100vh - 160px);padding:34px 0 70px}
    .eyebrow{margin:0 0 18px;color:var(--cyan);font:800 .78rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(3.2rem,8vw,7.2rem);line-height:.9;letter-spacing:-.065em}
    .lead{max-width:650px;margin:28px 0 0;color:#b0c6c8;font-size:clamp(1.05rem,2vw,1.26rem);line-height:1.85}
    .tags{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}.tags span{padding:7px 10px;border:1px solid var(--line);color:#9dc4c7;background:rgba(13,40,49,.65);font-size:.78rem;font-weight:800}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border:1px solid var(--line);color:#d6e6e7;background:#0c2028;text-decoration:none;font-weight:900;transition:transform .16s,border-color .16s}.button.primary{border-color:var(--cyan);color:#031114;background:var(--cyan)}.button:hover,.button:focus-visible{transform:translateY(-3px);border-color:#fff;outline:none}
    figure{position:relative;margin:0;padding:10px;border:1px solid var(--line);background:#07171d;box-shadow:0 28px 80px rgba(0,0,0,.45);transform:rotate(1deg)}
    figure:after{position:absolute;inset:10px;content:"";border:1px solid rgba(255,255,255,.14);pointer-events:none}
    .battle-art{position:relative;display:grid;width:100%;aspect-ratio:1200/630;overflow:hidden;place-items:center;background:radial-gradient(circle at 65% 38%,rgba(99,226,223,.55) 0 3%,transparent 4%),radial-gradient(circle at 30% 68%,rgba(255,93,91,.48) 0 4%,transparent 5%),linear-gradient(155deg,#113445 0 43%,#07161d 44% 54%,#4a1b20 55% 100%)}.battle-art:before,.battle-art:after{position:absolute;content:"";width:45%;height:18%;border:2px solid rgba(216,232,233,.46);background:rgba(4,16,21,.5);transform:skewX(-22deg)}.battle-art:before{top:22%;right:-5%}.battle-art:after{bottom:18%;left:-5%}.battle-art strong{position:relative;z-index:1;max-width:80%;text-align:center;font-size:clamp(1.6rem,4vw,3.4rem);letter-spacing:.14em;text-shadow:0 3px 18px #000}
    figcaption{display:flex;justify-content:space-between;gap:20px;padding:11px 4px 2px;color:#789294;font:700 .72rem ui-monospace,SFMono-Regular,Menlo,monospace}
    footer{display:flex;justify-content:space-between;gap:20px;padding:24px 0 34px;border-top:1px solid var(--line);color:#71898c;font-size:.82rem}
    footer strong{color:#a9c0c2}
    @media(max-width:840px){main{grid-template-columns:1fr;min-height:0;padding-top:30px}figure{order:-1}h1{font-size:clamp(3.7rem,17vw,6rem)}footer{flex-direction:column}}
    @media(max-width:520px){.shell{width:min(100% - 24px,1160px)}header{min-height:70px}.button{width:100%}figcaption span:last-child{display:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
