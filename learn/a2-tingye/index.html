<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="2;url=http://localhost:8069/learn/a2-tingye/">
  <title>正在打开听叶</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;color:#102f43;background:#f5eddc;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.card{max-width:520px;padding:40px;border-radius:28px;background:#fffdf8;box-shadow:0 24px 70px rgba(32,51,57,.12);text-align:center}.mark{display:grid;width:58px;height:58px;place-items:center;margin:0 auto 18px;border-radius:18px;color:#f5eddc;background:#102f43;font:700 28px/1 "Songti SC",serif}h1{margin:0;font:800 34px/1.25 "Songti SC",serif}p{color:#6e7b7d;line-height:1.7}a{display:inline-flex;min-height:44px;align-items:center;padding:0 18px;border-radius:12px;color:white;background:#d76f46;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card"><span class="mark">聽</span><h1>正在打开听叶</h1><p>本地文件入口会自动连接到已经完成的 A2 应用。</p><a id="open-a2" href="http://localhost:8069/learn/a2-tingye/">立即进入</a></main>
  <script>
    const host = location.protocol === "file:" ? "localhost" : (location.hostname || "localhost");
    const target = `http://${host}:8069/learn/a2-tingye/`;
    const link = document.getElementById("open-a2");
    link.href = target;
    window.setTimeout(() => location.replace(target), 120);
  </script>
</body>
</html>
